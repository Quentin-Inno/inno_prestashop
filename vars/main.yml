#### == Variables projet == ####
project_name: olow
domain: fajitas.innosys.fr
site_name: "{{ project_name }}.{{ domain }}"

#### == Variables Utilisateur == ####
my_remote_user: deploy

#### == Variables Dossier == ####
user_home: "/home/{{ my_remote_user }}"



#### == Variables containeurs == ####
docker_container:
    - name : data
      network :
        id: 21
        name: prestanet
      port: ["33062:3306"]
      restart_policy: always
      volume: ["/etc/localtime:/etc/localtime:ro","/var/log/{{ project_name }}/data:/var/log","{{ user_home }}/{{ project_name }}/db:/var/lib/mysql"]

    - name : prestashop
      network :
        id: 22
        name: prestanet
      port: ["8089:80","443:443"]
      restart_policy: always
      volume: ["/etc/localtime:/etc/localtime:ro","/var/log/{{ project_name }}/prestashop:/var/log/apache2","{{ user_home }}/{{ project_name }}/{{ site_name }}:/var/www/{{ project_name }}","{{ user_home }}/{{ project_name }}/vhost/{{ project_name }}.conf:/etc/apache2/sites-available/{{ project_name }}.conf"]

    
