## Activation du site
  - name: Activation Site
    shell: docker exec Inno_{{ project_name }}_{{ docker_container[1].name }} a2ensite {{ project_name }}.conf

## reload apache 
  - name: Reload apache
    shell: docker exec Inno_{{ project_name }}_{{ docker_container[1].name }} service apache2 start