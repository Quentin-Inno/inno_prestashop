## Copie du site
  - name: Copie du site
    shell: docker exec Inno_{{ project_name }}_{{ docker_container[1].name }} tomove=$(ls /var/www/html);for name in $tomove;do mv /var/www/html/$name /var/www/{{ project_name }}; done

